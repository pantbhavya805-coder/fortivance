# Production compose for the VPS. Usage (from the repo root on the server):
#   docker compose -f docker-compose.prod.yml up -d --build
# Secrets come from .env next to this file (never committed). See deploy/DEPLOY.md.
services:
  mysql:
    image: mysql:8.4
    container_name: fortivance-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fortivance}
      MYSQL_USER: ${DB_USER:-fortivance}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    # No "ports": MySQL is reachable only by the app on the internal Docker network.
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+05:30"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    container_name: fortivance-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fortivance}
      DB_USER: ${DB_USER:-fortivance}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      FORTIVANCE_DAILY_CAP_USD: ${FORTIVANCE_DAILY_CAP_USD:-3.00}
      # JVM heap cap for a small VPS; picked up automatically by the java launcher.
      JAVA_TOOL_OPTIONS: "-Xmx768m"
      # Trust X-Forwarded-Proto/Host from nginx so login redirects stay on https.
      SERVER_FORWARD_HEADERS_STRATEGY: native
    # Only nginx on the host can reach the app; port 8080 is not exposed publicly.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./sample-docs:/app/sample-docs:ro

volumes:
  mysql-data:
