# Production stack for the VPS: MySQL and the app stay on the internal network;
# only Caddy is exposed (ports 80/443) and obtains the HTTPS certificate automatically.
services:
  mysql:
    image: mysql:8.4
    container_name: fortivance-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fortivance}
      MYSQL_USER: ${DB_USER:-fortivance}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Kolkata
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+05:30"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    container_name: fortivance-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fortivance}
      DB_USER: ${DB_USER:-fortivance}
      DB_PASSWORD: ${DB_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      JAVA_TOOL_OPTIONS: "-Xmx768m"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "8080"
    volumes:
      - ./sample-docs:/app/sample-docs:ro

  caddy:
    image: caddy:2
    container_name: fortivance-caddy
    restart: always
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
