# Fortivance reverse proxy. Install as /etc/nginx/sites-available/fortivance and replace
# YOUR_DOMAIN with the real domain. certbot (--nginx) adds the HTTPS server block and the
# HTTP-to-HTTPS redirect to this file; see deploy/DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Incident notices and documents are uploaded through the app.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # AI calls (response plan, evidence mapping) can take 15-60 seconds.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
