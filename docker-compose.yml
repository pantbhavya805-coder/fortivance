services:
  mysql:
    image: mysql:8.4
    container_name: fortivance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fortivance}
      MYSQL_USER: ${DB_USER:-fortivance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fortivance}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+05:30"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: fortivance-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fortivance}
      DB_USER: ${DB_USER:-fortivance}
      DB_PASSWORD: ${DB_PASSWORD:-fortivance}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    ports:
      - "8080:8080"
    volumes:
      - ./sample-docs:/app/sample-docs:ro

volumes:
  mysql-data:
