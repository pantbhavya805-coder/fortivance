server:
  error:
    include-message: always
spring:
  application:
    name: fortivance
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fortivance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USER:fortivance}
    password: ${DB_PASSWORD:fortivance}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Browsers must revalidate pages, JS and CSS on every load (cheap: unchanged files get 304 Not Modified),
  # so a new deploy is picked up immediately instead of running a stale cached copy.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
        use-last-modified: true
  # Contact form SMTP (GoDaddy Titan mailbox). Credentials come only from the environment.
  mail:
    host: ${MAIL_HOST:smtpout.secureserver.net}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}

fortivance:
  sample-docs-path: ${SAMPLE_DOCS_PATH:./sample-docs}
  contact:
    # Mailbox that receives a notice for every demo request (defaults to the sending mailbox).
    to: ${CONTACT_TO:${MAIL_USERNAME:}}
  # Base URL used in emails (login and profile links).
  public-url: ${PUBLIC_URL:https://fortivance.in}
  # Permanent accounts created/updated at startup. Passwords come only from the environment;
  # when a password is empty its accounts are left untouched.
  accounts:
    owner-password: ${OWNER_PASSWORD:}
    judge-password: ${JUDGE_PASSWORD:}
    # true shows the judges' test account password on /judges.html (read from JUDGE_PASSWORD, never the repo).
    judge-password-public: ${JUDGE_PASSWORD_PUBLIC:false}
  demo:
    access-hours: ${DEMO_ACCESS_HOURS:24}
    max-extensions: ${DEMO_MAX_EXTENSIONS:2}
    requests-per-hour: ${DEMO_REQUESTS_PER_HOUR:3}

management:
  health:
    mail:
      enabled: false   # a mail outage must not mark the app unhealthy

  endpoints:
    web:
      exposure:
        include: health,info
