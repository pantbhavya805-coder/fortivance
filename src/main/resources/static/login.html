<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortivance - Sign In</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 2.75rem !important; }
        .pw-toggle {
            position: absolute; top: 50%; right: 0.5rem; transform: translateY(-50%);
            display: flex; align-items: center; justify-content: center;
            width: 2rem; height: 2rem; padding: 0; border: none; border-radius: 4px;
            background: transparent; color: var(--text-secondary); cursor: pointer;
        }
        .pw-toggle:hover { color: var(--navy); background: rgba(15, 39, 68, 0.06); }
        .pw-toggle:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
        .forgot-pw-link {
            font-size: 0.8125rem;
            color: var(--teal);
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-pw-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="brand">
            <svg class="login-brand-logo" viewBox="0 0 48 48" width="68" height="68" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Fortivance Logo" style="margin-bottom: 0.85rem; filter: drop-shadow(0 4px 16px rgba(13, 148, 136, 0.35));">
                <defs>
                    <linearGradient id="lShieldGrad" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#1e3a5f" />
                        <stop offset="100%" stop-color="#0a1b2f" />
                    </linearGradient>
                    <linearGradient id="lBorderGrad" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#2dd4bf" />
                        <stop offset="50%" stop-color="#0d9488" />
                        <stop offset="100%" stop-color="#1e3a5f" />
                    </linearGradient>
                    <linearGradient id="lNetGrad" x1="16" y1="14" x2="32" y2="34" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#5eead4" />
                        <stop offset="100%" stop-color="#0d9488" />
                    </linearGradient>
                </defs>
                <path d="M24 4.5 L39.5 10 C39.5 10 40 23.5 39.5 24.5 C38.5 33.5 32 40.5 24 43.5 C16 40.5 9.5 33.5 8.5 24.5 C8 23.5 8.5 10 8.5 10 Z" fill="url(#lShieldGrad)" stroke="url(#lBorderGrad)" stroke-width="2.5" stroke-linejoin="round" />
                <path d="M24 14 L24 33" stroke="url(#lNetGrad)" stroke-width="2.5" stroke-linecap="round" />
                <path d="M24 15 L33 19.5" stroke="url(#lNetGrad)" stroke-width="2.2" stroke-linecap="round" />
                <path d="M24 23.5 L31 23.5" stroke="url(#lNetGrad)" stroke-width="2.5" stroke-linecap="round" />
                <path d="M24 23.5 L16.5 27.5" stroke="url(#lNetGrad)" stroke-width="2.5" stroke-linecap="round" />
                <path d="M16.5 27.5 L24 33" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.5 2" />
                <path d="M33 19.5 L31 23.5" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
                <path d="M31 23.5 L24 33" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.5 2" />
                <circle cx="24" cy="14" r="3.2" fill="#0f2744" stroke="#2dd4bf" stroke-width="2" />
                <circle cx="24" cy="14" r="1.3" fill="#ffffff" />
                <circle cx="33" cy="19.5" r="2.6" fill="#0f2744" stroke="#14b8a6" stroke-width="1.8" />
                <circle cx="33" cy="19.5" r="1" fill="#2dd4bf" />
                <circle cx="31" cy="23.5" r="2.2" fill="#0f2744" stroke="#0d9488" stroke-width="1.6" />
                <circle cx="31" cy="23.5" r="0.9" fill="#5eead4" />
                <circle cx="16.5" cy="27.5" r="2.4" fill="#0f2744" stroke="#14b8a6" stroke-width="1.8" />
                <circle cx="16.5" cy="27.5" r="0.9" fill="#2dd4bf" />
                <circle cx="24" cy="33" r="2.4" fill="#0f2744" stroke="#0d9488" stroke-width="1.8" />
                <circle cx="24" cy="33" r="0.9" fill="#2dd4bf" />
            </svg>
            <h1>Fortivance</h1>
            <p class="subtitle">Operational Resilience &amp; TPRM</p>
        </div>

        <!-- Logout Banner -->
        <div class="auth-banner banner-info" id="logout-banner">
            You have been logged out successfully.
        </div>

        <!-- Error Banner -->
        <div class="auth-banner banner-error" id="error-banner">
            Invalid username or password. Please try again.
        </div>

        <form action="/login" method="post" class="login-form">
            <div class="form-group">
                <label for="username">Email or username</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="you@company.com" autocapitalize="none" spellcheck="false">
            </div>
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.35rem;">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                    <a href="/forgot-password.html" class="forgot-pw-link">Forgot password?</a>
                </div>
                <div class="pw-wrap">
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Password">
                    <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false" title="Show password">
                        <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <div style="text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--text-secondary);">
            Don't have access? <a href="/request-demo.html" style="color: var(--teal); font-weight: 500; text-decoration: none;">Request a demo</a>
        </div>

        <div class="auth-help">
            <div style="font-weight: 500; color: var(--navy);">Authorized Banking Personnel Only</div>
        </div>
    </div>

    <script>
        (function() {
            const pwInput = document.getElementById('password');
            const pwToggle = document.getElementById('pw-toggle');
            if (pwInput && pwToggle) {
                pwToggle.addEventListener('click', function() {
                    const show = pwInput.type === 'password';
                    pwInput.type = show ? 'text' : 'password';
                    pwToggle.setAttribute('aria-pressed', String(show));
                    pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                    pwToggle.title = show ? 'Hide password' : 'Show password';
                    pwToggle.querySelector('.eye-open').style.display = show ? 'none' : '';
                    pwToggle.querySelector('.eye-closed').style.display = show ? '' : 'none';
                    pwInput.focus();
                });
                // Never submit while the password is visible as plain text (browsers may cache text fields).
                pwInput.form.addEventListener('submit', function() {
                    pwInput.type = 'password';
                });
            }
        })();

        (function() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('logout')) {
                const banner = document.getElementById('logout-banner');
                if (banner) banner.style.display = 'block';
            } else if (params.get('error') === 'expired') {
                const banner = document.getElementById('error-banner');
                if (banner) {
                    banner.textContent = 'Your demo access has expired. Reply to your welcome email to ask for an extension.';
                    banner.style.display = 'block';
                }
            } else if (params.has('error')) {
                const banner = document.getElementById('error-banner');
                if (banner) {
                    banner.textContent = 'Invalid username or password. Please try again.';
                    banner.style.display = 'block';
                }
            } else {
                // If user is already authenticated and pressed back into login,
                // bounce them back to the application so they don't see the login form
                fetch('/api/me', { credentials: 'include' })
                    .then(res => {
                        if (res.ok) {
                            window.location.replace('/index.html');
                        }
                    })
                    .catch(() => {});
            }

            // Also check on bfcache restore
            window.addEventListener('pageshow', function() {
                const p = new URLSearchParams(window.location.search);
                if (!p.has('logout') && !p.has('error')) {
                    fetch('/api/me', { credentials: 'include' })
                        .then(res => {
                            if (res.ok) {
                                window.location.replace('/index.html');
                            }
                        })
                        .catch(() => {});
                }
            });
        })();
    </script>
</body>
</html>
