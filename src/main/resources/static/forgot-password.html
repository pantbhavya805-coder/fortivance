<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortivance - Reset Your Password</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        .page-container {
            max-width: 540px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }
        .form-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem 2.25rem;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }
        .form-header {
            margin-bottom: 1.75rem;
        }
        .form-header h1 {
            font-size: 1.5rem;
            color: var(--navy);
            margin-bottom: 0.5rem;
        }
        .intro-text {
            font-size: 0.925rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        .admin-note {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 0.35rem;
        }
        .form-group input[type="email"] {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-size: 0.875rem;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: #ffffff;
            color: var(--text-primary);
            box-sizing: border-box;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input[type="email"]:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }
        .input-error {
            border-color: var(--status-red) !important;
        }
        .field-error {
            font-size: 0.75rem;
            color: var(--status-red);
            font-weight: 500;
            margin-top: 0.3rem;
            min-height: 1em;
        }
        .banner-alert {
            background-color: var(--status-red-bg);
            color: var(--status-red);
            border: 1px solid #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-size: 0.8125rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        .success-card {
            background-color: var(--status-green-bg);
            border: 1px solid #86efac;
            border-radius: 8px;
            padding: 1.75rem;
            text-align: left;
            display: none;
        }
        .success-card h2 {
            font-size: 1.25rem;
            color: var(--navy);
            margin-bottom: 0.75rem;
        }
        .success-card p {
            font-size: 0.925rem;
            line-height: 1.6;
            color: var(--navy);
            margin-bottom: 1.25rem;
        }
        .footer-nav {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.8125rem;
        }
        .footer-nav a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 500;
        }
        .footer-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="header-nav">
        <div class="brand-section">
            <a href="/" class="brand-title">
                <img src="/images/logo-icon.svg" alt="Fortivance Logo" class="brand-logo" width="28" height="28">
                <span>Fortivance</span>
            </a>
            <span class="brand-subtitle">Operational Resilience &amp; TPRM</span>
        </div>
        <div class="nav-user-section" id="nav-user">
            <a href="/login.html" class="btn btn-primary">Log in</a>
        </div>
    </header>

    <main class="main-container">
        <div class="page-container">
            <div class="form-card">
                <div class="form-header">
                    <h1>Reset your password</h1>
                    <p class="intro-text">
                        Enter the email address you used to request your demo. We will send you a link to choose a new password.
                    </p>
                    <p class="admin-note">
                        Owner and judge accounts are managed by the administrator.
                    </p>
                </div>

                <div id="general-error" class="banner-alert" role="alert"></div>

                <form id="forgot-form" novalidate>
                    <div class="form-group">
                        <label for="field-email">Email <span style="color: var(--status-red);">*</span></label>
                        <input type="email" id="field-email" name="email" required maxlength="200" autocomplete="email" placeholder="e.g. jane@acmebank.com" autofocus>
                        <div class="field-error" id="error-email"></div>
                    </div>

                    <div style="margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-primary" id="submit-btn" style="width: 100%; padding: 0.75rem; font-size: 0.9375rem;">
                            Send reset link
                        </button>
                    </div>
                </form>

                <div id="success-panel" class="success-card">
                    <h2>Check your email</h2>
                    <p id="success-message"></p>
                    <div>
                        <a href="/login.html" class="btn btn-primary">Back to sign in</a>
                    </div>
                </div>
            </div>

            <div class="footer-nav">
                <a href="/login.html">&larr; Back to sign in</a>
            </div>
        </div>
    </main>

    <script>
        (function() {
            const form = document.getElementById('forgot-form');
            const submitBtn = document.getElementById('submit-btn');
            const emailInput = document.getElementById('field-email');
            const errorEmail = document.getElementById('error-email');
            const generalError = document.getElementById('general-error');
            const successPanel = document.getElementById('success-panel');
            const successMessage = document.getElementById('success-message');

            function validateEmail(val) {
                const s = (val || '').trim();
                if (!s) return 'Email is required.';
                if (s.length > 200) return 'Email must be 200 characters or fewer.';
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!re.test(s)) return 'Please enter a valid email address.';
                return '';
            }

            function setFieldStatus(input, errorEl, msg) {
                errorEl.textContent = msg;
                if (msg) {
                    input.classList.add('input-error');
                } else {
                    input.classList.remove('input-error');
                }
                return !msg;
            }

            emailInput.addEventListener('blur', function() {
                setFieldStatus(emailInput, errorEmail, validateEmail(emailInput.value));
            });

            emailInput.addEventListener('input', function() {
                if (errorEmail.textContent) {
                    setFieldStatus(emailInput, errorEmail, '');
                }
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                generalError.style.display = 'none';
                generalError.textContent = '';

                const emailErr = validateEmail(emailInput.value);
                setFieldStatus(emailInput, errorEmail, emailErr);

                if (emailErr) {
                    emailInput.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending...';

                const payload = { email: emailInput.value.trim() };

                try {
                    const res = await window.fetch('/api/password/forgot', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    let data = {};
                    try {
                        data = await res.json();
                    } catch (_) {}

                    if (res.status === 200) {
                        form.style.display = 'none';
                        successMessage.textContent = data.message || 'If an account exists for this email, we have sent a reset link. It is valid for 30 minutes.';
                        successPanel.style.display = 'block';
                        return;
                    }

                    if (res.status === 400) {
                        const errMsg = data.error || 'Please enter a valid email address.';
                        setFieldStatus(emailInput, errorEmail, errMsg);
                        emailInput.focus();
                        return;
                    }

                    if (res.status === 429) {
                        generalError.textContent = data.error || 'Too many requests. Please try again later.';
                        generalError.style.display = 'block';
                        return;
                    }

                    generalError.textContent = data.error || 'We could not process your request right now. Please try again later.';
                    generalError.style.display = 'block';

                } catch (err) {
                    generalError.textContent = 'We could not process your request right now. Please try again later.';
                    generalError.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send reset link';
                }
            });
        })();
    </script>
</body>
</html>
