<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
    <defs>
        <linearGradient id="shieldGrad" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1e3a5f" />
            <stop offset="100%" stop-color="#0a1b2f" />
        </linearGradient>
        <linearGradient id="borderGrad" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2dd4bf" />
            <stop offset="50%" stop-color="#0d9488" />
            <stop offset="100%" stop-color="#1e3a5f" />
        </linearGradient>
        <linearGradient id="netGrad" x1="16" y1="14" x2="32" y2="34" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#5eead4" />
            <stop offset="100%" stop-color="#0d9488" />
        </linearGradient>
        <radialGradient id="glow" cx="24" cy="22" r="16" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
        </radialGradient>
        <filter id="shadow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#050e1a" flood-opacity="0.45" />
        </filter>
    </defs>

    <!-- Outer Shield with Shadow -->
    <path d="M24 4.5 L39.5 10 C39.5 10 40 23.5 39.5 24.5 C38.5 33.5 32 40.5 24 43.5 C16 40.5 9.5 33.5 8.5 24.5 C8 23.5 8.5 10 8.5 10 L24 4.5 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#borderGrad)" 
          stroke-width="2" 
          stroke-linejoin="round"
          filter="url(#shadow)" />

    <!-- Ambient Center Glow -->
    <circle cx="24" cy="22" r="14" fill="url(#glow)" />

    <!-- Interconnected Dependency Graph / Stylized 'F' Lattice -->
    <!-- Connection Lines / Beams -->
    <path d="M24 14 L24 33" stroke="url(#netGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M24 15 L33 19.5" stroke="url(#netGrad)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M24 23.5 L31 23.5" stroke="url(#netGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M24 23.5 L16.5 27.5" stroke="url(#netGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M16.5 27.5 L24 33" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2.5 2" />
    <path d="M33 19.5 L31 23.5" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" />
    <path d="M31 23.5 L24 33" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2.5 2" />

    <!-- Network Nodes -->
    <!-- Bank Core Node (Top Center) -->
    <circle cx="24" cy="14" r="3.2" fill="#0f2744" stroke="#2dd4bf" stroke-width="2" />
    <circle cx="24" cy="14" r="1.3" fill="#ffffff" />

    <!-- Primary Vendor Service Node (Top Right) -->
    <circle cx="33" cy="19.5" r="2.6" fill="#0f2744" stroke="#14b8a6" stroke-width="1.8" />
    <circle cx="33" cy="19.5" r="1" fill="#2dd4bf" />

    <!-- Application / Integration Node (Mid Right) -->
    <circle cx="31" cy="23.5" r="2.2" fill="#0f2744" stroke="#0d9488" stroke-width="1.6" />
    <circle cx="31" cy="23.5" r="0.9" fill="#5eead4" />

    <!-- External Partner / Subcontractor Node (Left) -->
    <circle cx="16.5" cy="27.5" r="2.4" fill="#0f2744" stroke="#14b8a6" stroke-width="1.8" />
    <circle cx="16.5" cy="27.5" r="0.9" fill="#2dd4bf" />

    <!-- Sub-tier / Infrastructure Anchor Node (Bottom) -->
    <circle cx="24" cy="33" r="2.4" fill="#0f2744" stroke="#0d9488" stroke-width="1.8" />
    <circle cx="24" cy="33" r="0.9" fill="#2dd4bf" />
</svg>
