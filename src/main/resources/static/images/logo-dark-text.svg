<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 44" width="280" height="44" fill="none">
    <defs>
        <linearGradient id="logoShieldGradDark" x1="4" y1="2" x2="38" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1e3a5f" />
            <stop offset="100%" stop-color="#0f2744" />
        </linearGradient>
        <linearGradient id="logoBorderGradDark" x1="4" y1="2" x2="38" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0d9488" />
            <stop offset="50%" stop-color="#14b8a6" />
            <stop offset="100%" stop-color="#0f2744" />
        </linearGradient>
        <linearGradient id="logoNetGradDark" x1="12" y1="10" x2="30" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2dd4bf" />
            <stop offset="100%" stop-color="#0d9488" />
        </linearGradient>
    </defs>

    <!-- Shield Icon (x: 2..40, y: 2..42) -->
    <g transform="translate(1, 0)">
        <path d="M21 3.5 L36.5 9 C36.5 9 37 22.5 36.5 23.5 C35.5 32.5 29 39.5 21 42.5 C13 39.5 6.5 32.5 5.5 23.5 C5 22.5 5.5 9 5.5 9 L21 3.5 Z" 
              fill="url(#logoShieldGradDark)" 
              stroke="url(#logoBorderGradDark)" 
              stroke-width="1.8" 
              stroke-linejoin="round" />

        <!-- Network / F-Lattice -->
        <path d="M21 12 L21 31" stroke="url(#logoNetGradDark)" stroke-width="2.2" stroke-linecap="round" />
        <path d="M21 13 L30 17.5" stroke="url(#logoNetGradDark)" stroke-width="2" stroke-linecap="round" />
        <path d="M21 21.5 L28 21.5" stroke="url(#logoNetGradDark)" stroke-width="1.8" stroke-linecap="round" />
        <path d="M21 21.5 L13.5 25.5" stroke="url(#logoNetGradDark)" stroke-width="1.8" stroke-linecap="round" />
        <path d="M13.5 25.5 L21 31" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 1.5" />
        <path d="M30 17.5 L28 21.5" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" />
        <path d="M28 21.5 L21 31" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 1.5" />

        <!-- Nodes -->
        <circle cx="21" cy="12" r="2.8" fill="#0f2744" stroke="#2dd4bf" stroke-width="1.8" />
        <circle cx="21" cy="12" r="1.1" fill="#ffffff" />

        <circle cx="30" cy="17.5" r="2.2" fill="#0f2744" stroke="#14b8a6" stroke-width="1.6" />
        <circle cx="30" cy="17.5" r="0.9" fill="#2dd4bf" />

        <circle cx="28" cy="21.5" r="1.9" fill="#0f2744" stroke="#0d9488" stroke-width="1.4" />
        <circle cx="28" cy="21.5" r="0.8" fill="#5eead4" />

        <circle cx="13.5" cy="25.5" r="2.1" fill="#0f2744" stroke="#14b8a6" stroke-width="1.6" />
        <circle cx="13.5" cy="25.5" r="0.8" fill="#2dd4bf" />

        <circle cx="21" cy="31" r="2.1" fill="#0f2744" stroke="#0d9488" stroke-width="1.6" />
        <circle cx="21" cy="31" r="0.8" fill="#2dd4bf" />
    </g>

    <!-- Brand Typography (Dark Navy + Teal) -->
    <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4">
        <tspan fill="#0f2744">Forti</tspan><tspan fill="#0d9488">vance</tspan>
    </text>

    <!-- Subtitle / Mission Tagline -->
    <text x="49" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600" fill="#64748b" letter-spacing="0.7">
        OPERATIONAL RESILIENCE &amp; TPRM
    </text>
</svg>
